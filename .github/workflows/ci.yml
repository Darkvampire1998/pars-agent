name: Validate Pars Agent
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: npm install --no-save --package-lock=false jsdom
      - run: node tests/frontend.cjs
      - run: bash -n deploy/bootstrap.sh deploy/install.sh deploy/update.sh deploy/backup.sh
      - run: docker build -t pars-agent:ci .
