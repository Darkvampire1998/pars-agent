name: Validate Pars Agent
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --check app/static/app.js
      - run: npm install --no-save --package-lock=false jsdom
      - run: node tests/frontend.cjs
      - run: bash -n deploy/bootstrap.sh deploy/install.sh deploy/update.sh deploy/backup.sh deploy/manage.sh deploy/runtime.sh
      - run: bash -n mt5/run-wine.sh
      - run: docker build -t pars-agent:ci .
      - name: Validate domain and IP deployment configurations
        run: |
          python deploy/configure.py --ip 8.8.8.8 --port 8443 --host-build-network
          docker compose config --quiet
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
          COMPOSE_BAKE=false docker compose build app
          python deploy/configure.py --domain trade.example.com --reconfigure
          docker compose config --quiet
          docker compose run --rm --no-deps caddy caddy validate --config /etc/caddy/Caddyfile
          python deploy/configure.py --domain trade.example.com --image ghcr.io/test/pars-agent:git-0000000000000000000000000000000000000000 --reuse
          docker compose config --format json | python -c 'import json,sys; app=json.load(sys.stdin)["services"]["app"]; assert "build" not in app; assert app["image"].startswith("ghcr.io/")'
  connector-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          architecture: x64
      - run: python -m pip install -r mt5/requirements.txt
      - run: python -c "import MetaTrader5 as mt5, numpy; assert mt5.__version__ == '5.0.6231'; print('Official Windows SDK imports successfully')"
      - run: python -c "import ast, pathlib; ast.parse(pathlib.Path('mt5/connector.py').read_text()); print('Connector syntax validated')"
      - run: '$null = [scriptblock]::Create((Get-Content mt5/setup.ps1 -Raw)); Write-Host "PowerShell setup syntax validated"'
  publish:
    needs: [tests, connector-sdk]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested ready image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:git-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Pars Agent MT5 trading panel
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Verify published image starts without building
        run: |
          source deploy/runtime.sh
          ready_image="$IMAGE:git-$GITHUB_SHA"
          pull_image "$ready_image"
          ready_digest="$(verify_image "$ready_image" "$GITHUB_SHA")"
          python deploy/configure.py --ip 8.8.8.8 --image "$ready_digest"
          docker compose config --quiet
          docker compose up -d --no-build --pull never --wait --wait-timeout 120 app
          docker compose exec -T app python -c 'import json,urllib.request; result=json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=10)); assert result["status"] == "ok", result'
          docker compose exec -T app python -c 'from pathlib import Path; wheels=list(Path("/app/connector-wheels").glob("*.whl")); assert len(wheels)>=2; assert Path("/app/mt5/connector.py").is_file(); print("Offline connector wheels bundled")'
      - name: Clean up smoke-test containers
        if: always()
        run: docker compose down
